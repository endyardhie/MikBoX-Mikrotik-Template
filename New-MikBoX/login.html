<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="pragma" content="no-cache">
<meta http-equiv="expires" content="-1">
<meta name="theme-color" content="#EE7978">
<title>Login Hotspot</title>
<link rel="stylesheet" href="assets/style.css">
</head>
<body data-page="login">
<main class="wrap">
  <section class="card">
    <div class="brand" id="brand"></div>
    <button class="theme-btn" id="themeBtn" type="button" aria-label="Ganti tema terang/gelap"></button>
    <div class="notice" id="notice" hidden></div>
    <div class="alert" id="error" role="alert" hidden></div>

    <div class="tabs" id="tabs" role="tablist" hidden>
      <button class="tab" type="button" role="tab" data-mode="voucher" aria-selected="true">Voucher</button>
      <button class="tab" type="button" role="tab" data-mode="member" aria-selected="false">Member</button>
    </div>

    <form id="loginForm" autocomplete="off">
      <div class="field">
        <label for="username" id="userLabel">Kode voucher</label>
        <input class="input code" id="username" name="username" value="$(username)" autocapitalize="none" autocorrect="off" spellcheck="false" required>
      </div>
      <div class="field" id="passField" hidden>
        <label for="password">Password</label>
        <div class="input-wrap">
          <input class="input" id="password" type="password" autocomplete="current-password">
          <button class="eye" id="eye" type="button" aria-label="Tampilkan password"></button>
        </div>
      </div>
      <button class="btn btn-primary" id="loginBtn" type="submit">Masuk</button>
    </form>
    <div class="links"><a id="trialLink" hidden></a></div>
  </section>

  <section class="card" id="shop" hidden>
    <div class="section-title"><h2>Beli voucher</h2><span>Bayar dengan QRIS</span></div>
    <div id="packages"></div>
    <div class="links"><a id="checkLink"></a></div>
  </section>

  <section class="card" id="info" hidden>
    <div class="section-title"><h2 id="infoTitle"></h2></div>
    <div id="infoList"></div>
  </section>

  <div class="social" id="social"></div>
  <p class="foot" id="foot"></p>
</main>

<!-- RouterOS login target (CHAP hashes the password before it leaves the phone) -->
<form name="sendin" action="$(link-login-only)" method="post" hidden>
  <input type="hidden" name="username">
  <input type="hidden" name="password">
  <input type="hidden" name="dst" value="$(link-orig)">
  <input type="hidden" name="popup" value="true">
</form>

<script>
  var HS = {
    mac: "$(mac)", ip: "$(ip)", login: "$(link-login-only)", dst: "$(link-orig)",
    error: "$(error)", trial: "$(trial)", chapId: "$(chap-id)", chapChallenge: "$(chap-challenge)"
  };
</script>
<script src="assets/md5.js"></script>
<script src="config.js"></script>
<script src="assets/app.js"></script>
</body>
</html>
